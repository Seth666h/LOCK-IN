function blankStep(type){
  switch(type){
    case 'read':    return {type:'read', title:'Read this', body:'Explain the idea.\n\n~~~python\nprint("example")\n~~~'};
    case 'quiz':    return {type:'quiz', title:'Quick check', q:'Your question?', options:['A','B','C','D'], answer:0, why:'Explain why.'};
    case 'predict': return {type:'predict', title:'What does this print?', lang:'python', code:'x = 1\nprint(x)', answer:'1', why:'Explain.'};
    case 'code':    return {type:'code', title:'Write it', lang:'python', prompt:'What should they write?', starter:'', expect:'expected output', hint:'A nudge.'};
    case 'type':    return {type:'type', title:'From memory', prompt:'What command…?', answer:'answer', hint:'A nudge.'};
  }
  return {type:'read', title:'Step', body:''};
}

function paintSteps(){
  const host = $('#dSteps');
  if(!draft.steps.length){
    host.innerHTML = '<p class="muted" style="font-size:.88rem">No steps yet. Add a <strong>Read</strong> to explain something, then a <strong>Quiz</strong> or <strong>Code</strong> to make them practise it.</p>';
    return;
  }
  host.innerHTML = draft.steps.map((s, i) =>
    '<div class="steppedit" data-i="' + i + '">' +
      '<div class="hd">' +
        '<b>' + (i+1) + '. ' + s.type + '</b>' +
        '<span class="grow"></span>' +
        '<button class="btn ghost sm" data-up="' + i + '" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
        '<button class="btn ghost sm" data-down="' + i + '" ' + (i === draft.steps.length-1 ? 'disabled' : '') + '>↓</button>' +
        '<button class="btn danger sm" data-del="' + i + '">✕</button>' +
      '</div>' +
      stepFields(s, i) +
    '</div>').join('');

  $$('[data-del]').forEach(b => b.onclick = () => { draft.steps.splice(+b.dataset.del, 1); paintSteps(); paintJson(); });
  $$('[data-up]').forEach(b => b.onclick = () => {
    const i = +b.dataset.up;
    [draft.steps[i-1], draft.steps[i]] = [draft.steps[i], draft.steps[i-1]];
    paintSteps(); paintJson();
  });
  $$('[data-down]').forEach(b => b.onclick = () => {
    const i = +b.dataset.down;
    [draft.steps[i+1], draft.steps[i]] = [draft.steps[i], draft.steps[i+1]];
    paintSteps(); paintJson();
  });

  $$('#dSteps [data-f]').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = +inp.closest('.steppedit').dataset.i;
      const f = inp.dataset.f;
      let v = e.target.value;
      if(f === 'options') v = v.split('\n').map(x => x.trim()).filter(Boolean);
      if(f === 'answer' && draft.steps[i].type === 'quiz') v = +v || 0;
      draft.steps[i][f] = v;
      paintJson();
    });
  });
}

function stepFields(s, i){
  const T = (f, label, ph, val) =>
    '<label class="fld"><span>' + label + '</span><input data-f="' + f + '" placeholder="' + esc(ph || '') + '" value="' + esc(val == null ? '' : val) + '"></label>';
  const TA = (f, label, val, h) =>
    '<label class="fld"><span>' + label + '</span><textarea data-f="' + f + '" style="min-height:' + (h || 90) + 'px">' + esc(val || '') + '</textarea></label>';

  if(s.type === 'read') return T('title','Title','Read this', s.title) + TA('body','Body — use ~~~lang for code blocks', s.body, 140);
  if(s.type === 'quiz') return TA('q','Question', s.q, 70) + TA('options','Options (one per line)', (s.options||[]).join('\n'), 110) + T('answer','Correct index (0-based)','0', s.answer) + T('why','Explanation','Why that is the right answer', s.why);
  if(s.type === 'predict') return T('title','Title','What does this print?', s.title) + TA('code','Code', s.code, 110) + T('answer','Expected output','1', s.answer) + T('why','Explanation','Explain it', s.why);
  if(s.type === 'code') return T('title','Title','Write it', s.title) + T('lang','Language (python / bat / js)','python', s.lang) + TA('prompt','Prompt', s.prompt, 70) + TA('starter','Starter code', s.starter, 80) + T('expect','Expected output','expected output', s.expect) + T('hint','Hint','A nudge', s.hint);
  if(s.type === 'type') return T('title','Title','From memory', s.title) + TA('prompt','Prompt', s.prompt, 60) + T('answer','Accepted answer','answer', s.answer) + T('hint','Hint','A nudge', s.hint);
  return '';
}

function validateDraft(){
  if(!draft.title.trim()) return 'Give the lesson a title';
  if(!draft.steps.length) return 'Add at least one step';
  for(let i = 0; i < draft.steps.length; i++){
    const s = draft.steps[i];
    if(s.type === 'read' && !s.body) return 'Step ' + (i+1) + ': body is empty';
    if(s.type === 'quiz' && (!s.options || s.options.length < 2)) return 'Step ' + (i+1) + ': need at least 2 options';
    if(s.type === 'code' && !s.expect) return 'Step ' + (i+1) + ': expected output is empty';
    if(s.type === 'predict' && !s.answer) return 'Step ' + (i+1) + ': expected output is empty';
    if(s.type === 'type' && !s.answer) return 'Step ' + (i+1) + ': answer is empty';
  }
  return null;
}

const cmdInput = $('#cmdInput'), cmdResults = $('#cmdResults'), cmdPal = $('#cmdPal');
let cmdItems = [], cmdSel = 0;

function buildCmdItems(){
  const items = [];
  [['home','Home','🏠'],['lessons','All lessons','📚'],['cheats','Cheat sheet','📋'],
   ['playground','Playground','🎮'],['progress','Progress','📊'],
   ['teacher','Studio','🛠️'],['about','About','ℹ️']].forEach(([route, name, ic]) => {
    items.push({ ic, label:name, sub:'page', run: () => go(route) });
  });
  items.push({ ic:'🎲', label:'Random lesson', sub:'action', run: () => {
    const all = allLessons();
    const l = all[Math.floor(Math.random() * all.length)];
    go('lesson/' + l.id);
  }});
  items.push({ ic: S.hardMode ? '🥷' : '🎯', label: S.hardMode ? 'Turn off hard mode' : 'Turn on hard mode', sub:'action', run: () => {
    S.hardMode = !S.hardMode; save(); toast(S.hardMode ? 'Hard mode on' : 'Hard mode off'); render();
  }});
  items.push({ ic:'🌗', label:'Toggle light / dark', sub:'action', run: toggleTheme });
  allLessons().forEach(l => {
    const ic = l.subject === 'Python' ? '🐍' : l.subject === 'Batch' ? '🪟' : l.subject === 'JavaScript' ? '🟨' : l.subject === 'Web' ? '🌐' : '⌨️';
    items.push({ ic, label: l.title, sub: l.subject, run: () => go('lesson/' + l.id) });
  });
  return items;
}

function openCmdPal(){
  cmdPal.classList.add('on');
  cmdInput.value = '';
  cmdItems = buildCmdItems();
  cmdSel = 0;
  paintCmd('');
  setTimeout(() => cmdInput.focus(), 50);
}
function closeCmdPal(){ cmdPal.classList.remove('on'); }
function paintCmd(q){
  q = q.trim().toLowerCase();
  const filtered = cmdItems.filter(it =>
    !q || it.label.toLowerCase().includes(q) || (it.sub || '').toLowerCase().includes(q)
  ).slice(0, 14);
  if(!filtered.length){ cmdResults.innerHTML = '<div class="result">No matches.</div>'; return; }
  cmdResults.innerHTML = filtered.map((it, i) =>
    '<div class="result ' + (i === cmdSel ? 'sel' : '') + '" data-i="' + i + '">' +
      '<span class="ic">' + it.ic + '</span>' +
      '<span>' + esc(it.label) + '</span>' +
      '<span class="sub">' + esc(it.sub || '') + '</span>' +
    '</div>').join('');
  $$('#cmdResults .result').forEach((el, i) => {
    el.onclick = () => { const f = filtered[i]; if(f){ closeCmdPal(); f.run(); } };
  });
  cmdResults._filtered = filtered;
}
cmdInput.addEventListener('input', () => { cmdSel = 0; paintCmd(cmdInput.value); });
cmdInput.addEventListener('keydown', e => {
  const f = cmdResults._filtered || [];
  if(e.key === 'ArrowDown'){ e.preventDefault(); cmdSel = Math.min(cmdSel + 1, f.length - 1); paintCmd(cmdInput.value); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); paintCmd(cmdInput.value); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(f[cmdSel]){ closeCmdPal(); f[cmdSel].run(); } }
});
cmdPal.addEventListener('click', e => { if(e.target === cmdPal) closeCmdPal(); });
$('#paletteBtn').onclick = openCmdPal;
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openCmdPal(); }
  if(e.key === 'Escape'){ closeCmdPal(); $('#modal').classList.remove('on'); }
});

/* ============================================================
   theme
   ============================================================ */
function applyTheme(){ document.body.classList.toggle('light', S.theme === 'light'); }
function toggleTheme(){ S.theme = S.theme === 'light' ? 'dark' : 'light'; save(); applyTheme(); }
$('#themeBtn').onclick = toggleTheme;

/* modal backdrop */
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') e.target.classList.remove('on'); });

/* ============================================================
   boot
   ============================================================ */
applyTheme();
paintHud();
checkBadges();
if(!location.hash) location.hash = '#/home';
render();

(function(){
  const d = todayKey();
  if(!S.days[d]) S.days[d] = 0;
  S.lastActive = Date.now();
  save();
})();
</script>
</body>
