<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOCK IN — learn by doing</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#080b12;--bg2:#0d121c;--panel:#121a28;--panel2:#182233;
  --line:#22304a;--line2:#2e3f5c;
  --text:#e8eefb;--muted:#8d9bb5;--dim:#5f6d86;
  --acc:#38bdf8;--acc2:#a78bfa;--acc3:#22d3ee;
  --ok:#34d399;--bad:#fb7185;--warn:#fbbf24;
  --gold:#fbbf24;
  --r:14px;--r2:10px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 12% -8%,#14304d55,transparent 60%),
             radial-gradient(900px 500px at 92% 4%,#3b2a6b44,transparent 55%),var(--bg);
  color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
body.light{
  --bg:#f4f6fb;--bg2:#eef1f8;--panel:#ffffff;--panel2:#f7f9fd;
  --line:#d6dbe7;--line2:#b9c2d4;
  --text:#0e1524;--muted:#5b6680;--dim:#8a94ac;
  background:#f4f6fb;
}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit;font-size:.9rem;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:.92rem}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em}
code{font-family:var(--mono);font-size:.88em;background:#1b2637;padding:.12em .4em;border-radius:5px;color:#9fd9ff}
body.light code{background:#e2e8f5;color:#1e5f8f}
pre{margin:0}
::selection{background:#38bdf855}

header.top{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);background:#080b12cc;border-bottom:1px solid var(--line)}
body.light header.top{background:#ffffffcc}
.nav{max-width:1320px;margin:0 auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;letter-spacing:-.02em;font-size:1.15rem;cursor:pointer;user-select:none}
.brand .lock{font-size:1.1rem;filter:drop-shadow(0 0 8px #38bdf8aa)}
.brand i{font-style:normal;background:linear-gradient(92deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.navlinks{display:flex;gap:.15rem;margin-left:.6rem;flex-wrap:wrap}
.navlinks button{padding:.42rem .72rem;border-radius:9px;color:var(--muted);font-weight:600;font-size:.84rem;transition:.15s}
.navlinks button:hover{color:var(--text);background:#ffffff0d}
body.light .navlinks button:hover{background:#00000008}
.navlinks button.on{color:var(--text);background:linear-gradient(180deg,#ffffff14,#ffffff08);box-shadow:inset 0 0 0 1px var(--line2)}
body.light .navlinks button.on{background:#ffffff}
.hud{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:.4rem;background:var(--panel);border:1px solid var(--line);padding:.28rem .58rem;border-radius:999px;font-size:.76rem;font-weight:700}
.chip b{color:var(--acc3);font-variant-numeric:tabular-nums}
.chip small{color:var(--dim);font-weight:600;font-size:.64rem;text-transform:uppercase;letter-spacing:.06em}
.titlechip{
  background:linear-gradient(135deg,#fbbf2422,#a78bfa22);
  border-color:#fbbf2455;
  color:var(--gold);font-size:.74rem;
}
.titlechip span{font-weight:800}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:.95rem}
.iconbtn:hover{background:var(--panel2);border-color:var(--line2)}
main{max-width:1320px;margin:0 auto;padding:2rem 1.2rem 5rem}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
footer{border-top:1px solid var(--line);margin-top:3rem;padding:1.6rem 1.2rem;color:var(--dim);font-size:.8rem;text-align:center}

.muted{color:var(--muted)}.dim{color:var(--dim)}.center{text-align:center}
.row{display:flex;gap:.6rem;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}
.tag{display:inline-block;padding:.16rem .55rem;border-radius:999px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;background:#38bdf81f;color:var(--acc);border:1px solid #38bdf840}
.tag.v{background:#a78bfa1f;color:var(--acc2);border-color:#a78bfa40}
.tag.g{background:#34d3991f;color:var(--ok);border-color:#34d39940}
.tag.y{background:#fbbf241f;color:var(--warn);border-color:#fbbf2440}
.tag.r{background:#fb71851f;color:var(--bad);border-color:#fb718540}
.btn{display:inline-flex;align-items:center;gap:.45rem;justify-content:center;padding:.58rem 1.05rem;border-radius:var(--r2);font-weight:700;font-size:.87rem;background:var(--panel2);border:1px solid var(--line2);color:var(--text);transition:.15s}
.btn:hover{background:#1f2b3f;border-color:#3d5175;transform:translateY(-1px)}
body.light .btn:hover{background:#e8edf7}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#05121c;border-color:transparent;box-shadow:0 6px 24px -8px var(--acc)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ok{background:linear-gradient(135deg,#34d399,#22d3ee);color:#04140f;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1000;border-color:transparent}
.btn.sm{padding:.35rem .7rem;font-size:.79rem}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:#ffffff0a}
body.light .btn.ghost:hover{background:#00000008}
.btn.danger{background:transparent;border-color:#fb718555;color:var(--bad)}
.btn.danger:hover{background:#fb718518}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:1.3rem}
body.light .card{background:var(--panel)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.hero{padding:3rem 0 2.2rem;max-width:840px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:900;letter-spacing:-.035em;margin-bottom:.5rem}
.hero h1 span{background:linear-gradient(100deg,var(--acc),var(--acc2) 60%,var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:1.08rem;color:var(--muted);max-width:660px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-top:2rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.kpi b{display:block;font-size:1.7rem;font-weight:900;letter-spacing:-.03em;color:var(--acc3);font-variant-numeric:tabular-nums}
.kpi small{color:var(--dim);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* title banner */
.titlebanner{
  margin-top:1.6rem;padding:1.2rem 1.4rem;border-radius:var(--r);
  background:linear-gradient(120deg,#fbbf2418,#a78bfa1a 60%,#38bdf818);
  border:1px solid #fbbf2455;display:flex;gap:1rem;align-items:center;
}
.titlebanner .em{font-size:2.4rem;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 12px #fbbf2488)}
.titlebanner h3{margin:0;font-size:1.2rem;color:var(--gold);letter-spacing:-.02em}
.titlebanner .desc{color:var(--muted);font-size:.88rem;margin-top:.1rem}
.titlebanner .prog{margin-top:.5rem;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.titlebanner .prog div{height:100%;background:linear-gradient(90deg,var(--gold),var(--acc2))}

.lcard{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:1.15rem;cursor:pointer;transition:.18s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.6rem}
body.light .lcard{background:var(--panel)}
.lcard::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:0;transition:.2s}
.lcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 10px 40px -12px rgba(0,0,0,.8)}
.lcard:hover::after{opacity:1}
.lcard h3{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.lcard p{margin:0;font-size:.86rem;color:var(--muted);flex:1}
.lcard .foot{display:flex;align-items:center;gap:.5rem;font-size:.74rem;color:var(--dim);font-weight:700;flex-wrap:wrap}
.done-badge{position:absolute;top:.85rem;right:.85rem;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ok),var(--acc3));color:#04140f;display:grid;place-items:center;font-size:.85rem;font-weight:900;z-index:2}

.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.4rem}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:.5rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:.5rem .8rem}
.search input{background:none;border:none;outline:none;color:var(--text);flex:1}
.pill{padding:.36rem .8rem;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:.15s}
.pill:hover{color:var(--text);border-color:var(--line2)}
.pill.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#05121c;border-color:transparent}

.lhead{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.lhead h2{font-size:1.55rem;font-weight:900;letter-spacing:-.03em;margin:0}
.pbar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:.9rem 0 1.4rem}
.pbar div{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3));transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:99px}
.focusbar{display:flex;align-items:center;gap:.8rem;background:linear-gradient(90deg,#38bdf818,#a78bfa12);border:1px solid #38bdf840;border-radius:var(--r2);padding:.6rem .9rem;margin-bottom:1rem;font-size:.85rem;flex-wrap:wrap}
.focusbar b{font-family:var(--mono);font-size:1.15rem;color:var(--acc3);font-variant-numeric:tabular-nums}
.stepnav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem;align-items:center}
.dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.74rem;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--dim);transition:.15s;cursor:pointer}
.dot.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 3px #38bdf822}
.dot.done{background:#34d39922;border-color:#34d39966;color:var(--ok)}
.dot.locked{opacity:.35;cursor:not-allowed}
.dot:not(.locked):hover{transform:translateY(-2px)}
.step{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:1.6rem}
body.light .step{background:var(--panel)}
.step h3{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.step .body{color:#c6d2e6;font-size:.97rem}
body.light .step .body{color:#2a344a}
.step .body p{margin:.6em 0}
.step .body ul{margin:.5em 0;padding-left:1.3em}
.step .body li{margin:.25em 0}
pre.code{background:#070b12;border:1px solid var(--line);border-radius:var(--r2);padding:1rem 1.1rem;font-family:var(--mono);font-size:.86rem;line-height:1.65;overflow-x:auto;color:#c9e5ff;white-space:pre;margin:.8rem 0}
body.light pre.code{background:#0f1521;color:#d6ecff}
textarea.editor{width:100%;min-height:150px;background:#070b12;border:1px solid var(--line);border-radius:var(--r2);padding:1rem;font-family:var(--mono);font-size:.88rem;line-height:1.6;color:#c9e5ff;resize:vertical;outline:none}
body.light textarea.editor{background:#0f1521;color:#d6ecff}
textarea.editor:focus{border-color:var(--acc);box-shadow:0 0 0 3px #38bdf822}
input.answer{width:100%;background:#070b12;border:1px solid var(--line);border-radius:var(--r2);padding:.75rem 1rem;font-family:var(--mono);font-size:.92rem;color:#c9e5ff;outline:none}
body.light input.answer{background:#0f1521;color:#d6ecff}
input.answer:focus{border-color:var(--acc);box-shadow:0 0 0 3px #38bdf822}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.15s;margin-bottom:.5rem;font-size:.93rem}
.opt:hover{border-color:var(--line2);background:#1c2739}
body.light .opt:hover{background:#edf1fa}
.opt .k{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;background:#0b1220;border:1px solid var(--line2);font-size:.75rem;font-weight:900;color:var(--muted)}
body.light .opt .k{background:#e8edf7}
.opt.sel{border-color:var(--acc);background:#38bdf814}
.opt.sel .k{background:var(--acc);color:#04121c;border-color:transparent}
.opt.right{border-color:var(--ok);background:#34d39918}
.opt.right .k{background:var(--ok);color:#04140f;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:#fb718518}
.opt.wrong .k{background:var(--bad);color:#1c0409;border-color:transparent}
.feedback{border-radius:var(--r2);padding:.85rem 1rem;margin-top:1rem;font-size:.9rem;border:1px solid;display:flex;gap:.7rem}
.feedback.ok{background:#34d39912;border-color:#34d39955;color:#a7f3d0}
body.light .feedback.ok{color:#0a7050}
.feedback.bad{background:#fb718512;border-color:#fb718555;color:#fecdd3}
body.light .feedback.bad{color:#a42340}
.feedback .ic{font-size:1.05rem;line-height:1.3}
.hintbox{margin-top:.7rem;font-size:.83rem;color:var(--warn);background:#fbbf2410;border:1px dashed #fbbf2440;padding:.6rem .8rem;border-radius:var(--r2)}
body.light .hintbox{color:#8a5a00}
.stepfoot{display:flex;gap:.7rem;align-items:center;margin-top:1.5rem;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:1.2rem}
.console{background:#04070c;border:1px solid var(--line);border-radius:var(--r2);padding:1rem;font-family:var(--mono);font-size:.85rem;line-height:1.6;min-height:120px;max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#8ce99a;margin-top:.8rem}
.console .err{color:var(--bad)}.console .sys{color:var(--dim)}

.pg{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:860px){.pg{grid-template-columns:1fr}}
.langtabs{display:flex;gap:.3rem;margin-bottom:.7rem;flex-wrap:wrap}

.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:4px;margin-top:.8rem}
.heat i{aspect-ratio:1;border-radius:4px;background:#141d2c;display:block}
body.light .heat i{background:#e2e8f5}
.heat i.l1{background:#0e4a63}.heat i.l2{background:#147d9e}
.heat i.l3{background:#22b8d6}.heat i.l4{background:#5ee0f5}
.badge{display:flex;gap:.7rem;align-items:center;padding:.75rem .9rem;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--line);opacity:.4;transition:.2s}
.badge.got{opacity:1;border-color:#fbbf2455;background:linear-gradient(135deg,#fbbf2412,#a78bfa10)}
.badge .ic{font-size:1.5rem;width:34px;text-align:center}
.badge b{display:block;font-size:.88rem}
.badge small{color:var(--dim);font-size:.74rem}
.lvlbar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.lvlbar div{height:100%;background:linear-gradient(90deg,var(--acc3),var(--acc),var(--acc2));transition:width .6s}

.titlegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.9rem}
.tcard{
  padding:1rem;border-radius:var(--r);border:1px solid var(--line);background:var(--panel2);
  opacity:.5;transition:.2s;position:relative;
}
.tcard.got{opacity:1;border-color:#fbbf2466;background:linear-gradient(135deg,#fbbf2410,#a78bfa08)}
.tcard.current{border-color:var(--gold);box-shadow:0 0 0 3px #fbbf2430}
.tcard .em{font-size:1.8rem;line-height:1}
.tcard h4{margin:.4rem 0 .1rem;font-size:1rem;letter-spacing:-.01em}
.tcard small{color:var(--dim);font-size:.75rem;font-weight:600}
.tcard .lock{position:absolute;top:.6rem;right:.7rem;font-size:.85rem;color:var(--dim)}

.studio{display:grid;grid-template-columns:360px 1fr;gap:1.2rem;align-items:start}
@media(max-width:960px){.studio{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:1.2rem}
body.light .panel{background:var(--panel)}
.panel h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin-bottom:.9rem}
.fld{display:block;margin-bottom:.8rem}
.fld span{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:.3rem}
.fld input,.fld select,.fld textarea{width:100%;background:#070b12;border:1px solid var(--line);border-radius:var(--r2);padding:.55rem .75rem;color:var(--text);outline:none}
body.light .fld input,body.light .fld select,body.light .fld textarea{background:#f9fafd}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc)}
.fld textarea{font-family:var(--mono);font-size:.82rem;min-height:70px;resize:vertical}
.steppedit{border:1px solid var(--line);border-radius:var(--r2);padding:.9rem;margin-bottom:.7rem;background:#0c1320}
body.light .steppedit{background:#f7f9fd}
.steppedit .hd{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem}
.steppedit .hd b{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.steppedit .hd .grow{flex:1}

#toast{position:fixed;bottom:1.4rem;left:50%;transform:translate(-50%,140%);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#05121c;font-weight:800;padding:.75rem 1.3rem;border-radius:999px;box-shadow:0 12px 40px -8px #38bdf8aa;z-index:200;transition:transform .35s cubic-bezier(.34,1.56,.64,1);font-size:.88rem;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast.gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#1a1000;box-shadow:0 12px 40px -8px #fbbf24aa}
.modal{position:fixed;inset:0;background:#04070ccc;backdrop-filter:blur(6px);z-index:150;display:none;place-items:center;padding:1.2rem}
.modal.on{display:grid}
.modal .box{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:18px;padding:2rem;max-width:560px;width:100%;text-align:center;box-shadow:0 10px 40px -12px rgba(0,0,0,.8);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
body.light .modal .box{background:var(--panel)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal .big{font-size:3.4rem;line-height:1}
.modal h2{font-size:1.6rem;font-weight:900;margin-top:.5rem}

.cmdpal{position:fixed;inset:0;background:#04070cd9;backdrop-filter:blur(8px);z-index:180;display:none;align-items:flex-start;justify-content:center;padding:8vh 1.2rem 1.2rem}
.cmdpal.on{display:flex}
.cmdpal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:620px;width:100%;box-shadow:0 20px 60px -10px #000;overflow:hidden;animation:pop .25s ease}
body.light .cmdpal .box{background:#fff}
.cmdpal input{width:100%;background:transparent;border:none;outline:none;padding:1rem 1.2rem;font-size:1rem;color:var(--text);border-bottom:1px solid var(--line)}
.cmdpal .results{max-height:52vh;overflow:auto;padding:.4rem}
.cmdpal .result{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;border-radius:10px;cursor:pointer;font-size:.92rem}
.cmdpal .result:hover,.cmdpal .result.sel{background:var(--panel2)}
.cmdpal .result .ic{width:26px;text-align:center}
.cmdpal .result .sub{color:var(--dim);font-size:.78rem;margin-left:auto}

.cheat{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem}
.cheatcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem}
.cheatcard h4{margin:0 0 .6rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.cheatcard .row{display:flex;gap:.7rem;padding:.28rem 0;font-size:.85rem;border-bottom:1px dashed var(--line)}
.cheatcard .row:last-child{border-bottom:none}

<script>
/* ============================================================
   helpers
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function md(t){
  if(!t) return '';
  let h = String(t);
  const blocks = [];
  h = h.replace(/~~~(\w*)\n([\s\S]*?)~~~/g, (_, lang, code) => {
    blocks.push('<pre class="code">' + esc(code.replace(/\n$/,'')) + '</pre>');
    return '\x00B' + (blocks.length-1) + '\x00';
  });
  h = esc(h);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.split(/\n\n+/).map(p => {
    p = p.trim();
    if(!p) return '';
    if(/^\x00B\d+\x00$/.test(p)) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  h = h.replace(/\x00B(\d+)\x00/g, (_, i) => blocks[+i]);
  return h;
}

let toastT = null;
function toast(msg, gold){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('gold', !!gold);
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 2800);
}

/* ============================================================
   state
   ============================================================ */
const KEY = 'lockin.v5';
const defaultState = () => ({
  xp:0, completed:{}, lessonsDone:0, quizTotal:0, quizRight:0,
  codeDone:0, focusMinutes:0, days:{}, badges:[], custom:[],
  notes:{}, timeSpent:{}, lastActive:null,
  hardMode:false, theme:'dark', recent:[],
  lastTitle:'Beginner', titlesSeen:['Beginner']
});
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign(defaultState(), JSON.parse(raw)); }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function pushRecent(ic, text){
  S.recent = S.recent || [];
  S.recent.unshift({ic, text, when: Date.now()});
  if(S.recent.length > 40) S.recent.length = 40;
  save();
}

const todayKey = () => new Date().toISOString().slice(0,10);
function addXp(n, why){
  S.xp += n;
  const d = todayKey();
  S.days[d] = (S.days[d]||0) + n;
  save(); paintHud();
  if(why) toast('+' + n + ' XP · ' + why);
}
const levelOf = xp => Math.floor(Math.sqrt(xp/8)) + 1;
const xpForLevel = l => Math.pow(l-1,2)*8;
function streak(){
  let n = 0; const d = new Date();
  for(let i = 0; i < 400; i++){
    const k = d.toISOString().slice(0,10);
    if(S.days[k]) { n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

/* ============================================================
   RANKS — titles you unlock as you level up
   ============================================================ */
const RANKS = [
  { min:1,  name:'Beginner',                     em:'🌱', desc:'Just got here. Everyone starts here.' },
  { min:5,  name:'Learning the Ropes',           em:'📘', desc:'You stopped closing the tab after one error.' },
  { min:10, name:'Starting to Get Used to It',   em:'🚀', desc:'Syntax is starting to stick. Good sign.' },
  { min:15, name:'Getting the Hang of It',       em:'💪', desc:'You are not googling every other line now.' },
  { min:20, name:'Coming Good',                  em:'🎯', desc:'Something clicked. Keep going.' },
  { min:25, name:'Doing Well',                   em:'⭐', desc:'You actually know what you are doing.' },
  { min:30, name:'Good Job',                     em:'🏆', desc:'You earned this one.' }
];
const MASTER = { min:999, name:'Master Coder', em:'👑', desc:'Every single lesson finished. Fair play.' };

function allLessons(){ return LESSONS.concat(S.custom || []); }
function isMaster(){
  const list = allLessons();
  if(!list.length) return false;
  return list.every(l => S.completed[l.id]);
}
function currentRank(){
  if(isMaster()) return MASTER;
  const lvl = levelOf(S.xp);
  let r = RANKS[0];
  for(const x of RANKS){ if(lvl >= x.min) r = x; }
  return r;
}
function nextRank(){
  if(isMaster()) return null;
  const lvl = levelOf(S.xp);
  for(const x of RANKS){ if(lvl < x.min) return x; }
  return null;
}

function checkRankUp(){
  const r = currentRank();
  if(S.lastTitle !== r.name){
    S.lastTitle = r.name;
    if(!S.titlesSeen) S.titlesSeen = [];
    if(!S.titlesSeen.includes(r.name)) S.titlesSeen.push(r.name);
    save();
    toast(r.em + ' New rank: ' + r.name, true);
    pushRecent(r.em, 'Rank unlocked: ' + r.name);
    paintHud();
  }
}

  {id:'builder', ic:'🛠️', name:'Builder',         desc:'Publish a custom lesson',           test:()=>S.custom.length>=1},
  {id:'notekeeper',ic:'📝', name:'Note taker',    desc:'Write real notes in a lesson',      test:()=>Object.values(S.notes||{}).some(v=>v && v.trim().length>10)},
  {id:'hard',    ic:'🥷', name:'Hard mode',       desc:'Finish a lesson with hard mode on', test:()=>S.badges.includes('hard')}
];
function checkBadges(){
  BADGES.forEach(b => {
    if(!S.badges.includes(b.id) && b.test()){
      S.badges.push(b.id); save();
      pushRecent('🏅', 'Badge: ' + b.name);
      toast(b.ic + ' Badge: ' + b.name, true);
    }
  });
}

function paintHud(){
  $('#hudXp').textContent = S.xp;
  $('#hudLvl').textContent = levelOf(S.xp);
  $('#hudStreak').textContent = streak();
  const r = currentRank();
  const t = $('#hudTitle');
  if(t) t.textContent = r.em + ' ' + r.name;
}

"Put an `f` in front of the quotes and you can drop variables right in.\n\n~~~python\nname = \"Ada\"\nage = 36\nprint(f\"{name} is {age}\")\n~~~\n\nThat prints `Ada is 36`. It is the easiest way to build strings from variables. Much cleaner than gluing with `+`."},
    {type:'quiz', title:'Quick check', q:'What does `"hello".upper()` give?',
     options:['"hello"','"HELLO"','"Hello"','error'], answer:1,
     why:'upper() makes a new all-caps string.'},
    {type:'predict', title:'What does this print?', lang:'python',
     code:'name = "Ada"\nage = 36\nprint(f"{name} is {age}")', answer:'Ada is 36',
     why:'The f-string drops the variables in where the braces are.'},
    {type:'code', title:'Write it', lang:'python',
     prompt:'Print `"PYTHON".lower()`.',
     starter:'', expect:'python',
     hint:'print("PYTHON".lower())'}
  ]
},
{

"Booleans are `True` and `False`. Capital first letter.\n\nComparisons give you a boolean:\n\n~~~python\nx = 5\nprint(x > 3)     # True\nprint(x < 3)     # False\nprint(x == 5)    # True\nprint(x != 5)    # False\n~~~\n\nYou chain them with `and` and `or`.\n\n~~~python\nif x > 0 and x < 10:\n    print(\"in range\")\n~~~"},

{
  id:'bat-1', title:'Batch: Your first .bat file', subject:'Batch', level:'Beginner', minutes:8,
  tags:['batch','windows'], desc:'A text file full of Windows commands. Double click it and it runs.',
  steps:[
    {type:'read', title:'What a .bat file actually is', body:
"A batch file is a plain text file saved with a `.bat` extension. Windows reads it line by line and runs each line as a command. That is the whole idea.\n\n~~~bat\n@echo off\necho Hello, world!\npause\n~~~\n\nSave that as `hello.bat` and double click it.\n\n- `@echo off` hides the commands themselves. Without it, Windows prints every line before running it and the output looks like a mess.\n- `echo` prints text.\n- `pause` waits for a key press. Without it the window closes instantly and you never see your output. This one catches everybody."},
    {type:'quiz', title:'Quick check', q:'What does `@echo off` do?',
     options:['shuts down the PC','hides the commands from being printed','clears the screen','deletes the file'], answer:1,
     why:'It stops Windows printing each command before running it. It does not affect your output.'},
    {type:'code', title:'Write it', lang:'bat',
     prompt:'Print `LOCKED IN` using echo.',
     starter:'@echo off\n', expect:'LOCKED IN',
     hint:'echo LOCKED IN'},
    {type:'read', title:'Variables', body:
"Use `set` to make one. Reference it with percent signs on both sides.\n\n~~~bat\nset name=Ada\necho Hello %name%\n~~~\n\nOne annoying gotcha: **no spaces around the equals sign**. `set name = Ada` sets a variable called `name ` (with a trailing space) to ` Ada` (with a leading space). Then your echo prints something weird and you have no idea why."},
    {type:'quiz', title:'Quick check', q:'How do you print the value of a variable called `user`?',
     options:['echo user','echo $user','echo %user%','print(user)'], answer:2,
     why:'Percent signs on both sides. Dollar signs are for other shells.'}
  ]
},
{
  id:'bat-2', title:'Batch: Asking for input', subject:'Batch', level:'Beginner', minutes:9,
  tags:['batch','windows'], desc:'Prompt the user, then do something based on what they typed.',
  steps:[
    {type:'read', title:'set /p', body:
"`set /p` shows a prompt and stores whatever the user types.\n\n~~~bat\n@echo off\nset /p name=What is your name? \necho Hello, %name%!\n~~~\n\nNotice the trailing space after the question mark. That is on purpose. It separates your prompt from where the user starts typing."},
    {type:'read', title:'Deciding on the answer', body:
"~~~bat\nif \"%name%\"==\"Ada\" echo Great name!\n~~~\n\nQuotes around the variable stop errors when it is empty or has spaces in it. Get in the habit."},
    {type:'quiz', title:'Quick check', q:'Which command asks the user for input?',
     options:['echo','set /p','input','read'], answer:1,
     why:'set /p prompts and stores. echo just prints.'},
    {type:'predict', title:'What does this print?', lang:'bat',

     why:'x is 5, so the condition is true and echo runs.'},
    {type:'code', title:'Write it', lang:'bat',
     prompt:'Set `mode=fast`. If mode equals fast, print `ZOOM`.',
     starter:'@echo off\n', expect:'ZOOM',

},
{
  id:'bat-3', title:'Batch: Numbers with set /a', subject:'Batch', level:'Intermediate', minutes:10,
  tags:['batch','windows','math'], desc:'Batch can do arithmetic. Whole numbers only, and there is a weird percent thing.',
  steps:[
    {type:'read', title:'set /a', body:
"Plain `set` treats everything as text. `set /a` does math.\n\n~~~bat\nset /a x=5+3\necho %x%\n~~~\n\nOutput is `8`.\n\nYou can use `+ - * /` and `%` for remainder.\n\n~~~bat\nset /a r=17 %% 5\n~~~\n\nThat prints `2`. Notice the double percent. In a batch file one `%` means \"expand a variable\", so a literal percent sign has to be doubled. Yes that is annoying. Yes everybody complains about it."},
    {type:'quiz', title:'Quick check', q:'What is the difference between `set x=5+3` and `set /a x=5+3`?',
     options:['No difference','The first stores the text "5+3", the second stores 8','The second crashes','The first is faster'], answer:1,
     why:'Plain set treats everything as a string. Only set /a evaluates the math.'},
    {type:'read', title:'Comparing numbers', body:
"Comparison operators in batch are words, not symbols.\n\n- `equ` equal\n- `neq` not equal\n- `lss` less than\n- `leq` less than or equal\n- `gtr` greater than\n- `geq` greater than or equal\n\n~~~bat\nset /a n=10\nif %n% gtr 5 echo big\nif %n% lss 20 echo small enough\n~~~\n\nWhy words? Because `>` and `<` are redirection operators in batch. If you wrote `if %n% > 5`, batch would try to write your output to a file called `5`. Not what you wanted."},
    {type:'quiz', title:'Quick check', q:'Which operator means "greater than" in a batch if?',
     options:['>','gt','gtr','GREATER'], answer:2,
     why:'> is redirect. The word form is gtr.'},
    {type:'code', title:'Do some math', lang:'bat',
     prompt:'Use `set /a` to set `total` to 7 times 6, then echo it.',
     starter:'@echo off\n', expect:'42',
     hint:'set /a total=7*6  then  echo %total%'}
  ]
},
{
  id:'bat-4', title:'Batch: goto and menu scripts', subject:'Batch', level:'Intermediate', minutes:11,
  tags:['batch','windows','menu'], desc:'Labels, goto, and building the classic numbered menu.',
  steps:[
    {type:'read', title:'Labels and goto', body:
"A label is a line that starts with a colon. `goto` jumps to it.\n\n~~~bat\n@echo off\ngoto :skip\necho this never runs\n:skip\necho we landed here\n~~~\n\nOutput is just `we landed here`. The goto skipped over the echo in between."},
    {type:'read', title:'A menu', body:
"This is the shape of almost every batch menu you have ever clicked through.\n\n~~~bat\n@echo off\n:menu\ncls\necho 1. Say hello\necho 2. Say goodbye\necho 3. Quit\nset /p choice=Pick one: \n\nif \"%choice%\"==\"1\" goto :hello\nif \"%choice%\"==\"2\" goto :bye\nif \"%choice%\"==\"3\" exit /b\ngoto :menu\n\n:hello\necho Hello!\npause\ngoto :menu\n\n:bye\necho Goodbye!\npause\ngoto :menu\n~~~\n\nThe `goto :menu` at the end of each branch sends you back to the top. Without it the script falls through and runs every branch below, which is not what you want."},
    {type:'quiz', title:'Quick check', q:'What does `goto :menu` do?',
     options:['exits the script','jumps to the line labelled :menu','prints "menu"','deletes the label'], answer:1,
     why:'goto jumps to a label. The label has to exist or batch errors out.'},
    {type:'quiz', title:'Quick check', q:'Why put `goto :menu` at the end of each branch?',
     options:['to make it faster','so the script loops back to the menu instead of falling through','it is required syntax','to close the file'], answer:1,
     why:'Without it, the script keeps going down the file and runs every branch below.'},
    {type:'code', title:'Write a jump', lang:'bat',
     prompt:'Skip over an echo using goto. Only print `landed`.',
     starter:'@echo off\n', expect:'landed',
     hint:'goto :skip / echo not this / :skip / echo landed'}
  ]
},
{
  id:'bat-5', title:'Batch: Files and folders', subject:'Batch', level:'Intermediate', minutes:11,
  tags:['batch','windows','files'], desc:'Copy, move, delete. And check first so you do not blow anything up.',
  steps:[
    {type:'read', title:'The usual suspects', body:
"Common file commands:\n\n~~~\nmkdir name        make a folder\nrmdir name        remove an empty folder\ndel file.txt      delete a file\ncopy a.txt b.txt  copy\nmove a.txt ..     move\nren a.txt b.txt   rename\n~~~\n\nA few things to know:\n\n- `del` does not ask for confirmation. It is gone.\n- `copy` and `move` will ask \"overwrite?\" if the target exists. Add `/y` to auto yes.\n- `rmdir` refuses to delete a folder with stuff in it. `rmdir /s /q` will. Be careful."},
    {type:'read', title:'Check first', body:
"Before you delete or overwrite, check it exists.\n\n~~~bat\nif exist report.txt (\n    echo Found it\n) else (\n    echo No report.txt here\n)\n~~~\n\nAnd with not:\n\n~~~bat\nif not exist backup mkdir backup\n~~~\n\nThat one makes the folder only if it is missing. Safe to run twice. Safe to run a hundred times."},
    {type:'quiz', title:'Quick check', q:'What does `if not exist backup mkdir backup` do?',
     options:['always creates the folder','errors if the folder exists','creates the folder only if it is missing','deletes the folder'], answer:2,
     why:'Not exist means it is missing, so make it. Safe to run repeatedly.'},
    {type:'quiz', title:'Quick check', q:'Why add `/y` to a copy command?',
     options:['it is faster','to skip the "overwrite?" prompt','to make a backup','it means yes to everything'], answer:1,
     why:'Without /y, copy prompts if the target exists. With /y it just overwrites.'},
    {type:'read', title:'A safe backup snippet', body:
"~~~bat\nset src=notes.txt\nset dst=backup\\notes.bak\n\nif not exist backup mkdir backup\nif exist %src% copy %src% %dst% /y\n~~~\n\nRun it once, it makes the folder and copies the file. Run it again, it just overwrites the backup. Nothing breaks if the file is missing."}
  ]
},
{
  id:'bat-6', title:'Batch: for loops (the %% thing)', subject:'Batch', level:'Advanced', minutes:12,
  tags:['batch','windows','loops'], desc:'The loop syntax everybody hates. Once you learn it, it is fine.',
  steps:[
    {type:'read', title:'Why %%', body:
"In a batch file, loop variables use double percent signs. Reason: Windows already uses single `%` for variables.\n\n~~~bat\nfor %%i in (a b c) do echo %%i\n~~~\n\nPrints a, then b, then c.\n\nImportant gotcha: if you run this directly in the Command Prompt (not in a .bat file), you use single %:\n\n~~~\nfor %i in (a b c) do echo %i\n~~~\n\nIn a .bat file you must double it. It is inconsistent and everybody agrees it is annoying."},
    {type:'quiz', title:'Quick check', q:'In a .bat file, how many % do you put before the loop variable?',
     options:['one','two','three','none'], answer:1,
     why:'Two in a .bat file. One if you type it straight into cmd.'},
    {type:'read', title:'Counting loops', body:
"For a numbered range, use `/l` (lowercase L, not a one):\n\n~~~bat\nfor /l %%i in (1,1,5) do echo %%i\n~~~\n\nThe three numbers are start, step, end. Start at 1, add 1 each time, stop at 5. Output is 1 2 3 4 5."},
    {type:'quiz', title:'Quick check', q:'What does `for /l %%i in (1,2,7)` produce?',
     options:['1 2 3 4 5 6 7','1 3 5 7','1 7','2 4 6'], answer:1,
     why:'Start at 1, add 2 each time, stop at 7. So 1, 3, 5, 7.'},
    {type:'read', title:'Looping over files', body:
"This is the useful one. Loop over every file matching a pattern.\n\n~~~bat\nfor %%f in (*.txt) do echo Found: %%f\n~~~\n\nTo actually do something with each file:\n\n~~~bat\nfor %%f in (*.txt) do ren \"%%f\" \"%%~nf.bak\"\n~~~\n\n`%%~nf` means \"the filename without the extension\". So `report.txt` becomes `report.bak`. Run that in a folder of .txt files and they all get renamed at once. Useful once, dangerous if you mistype the pattern."},
    {type:'quiz', title:'Quick check', q:'What does `%%~nf` give you?',
     options:['the full path','just the filename without extension','the file size','the folder'], answer:1,
     why:'The tilde-f modifier strips the extension.'}
  ]
},
{
  id:'bat-7', title:'Batch: Error levels and && ||', subject:'Batch', level:'Advanced', minutes:10,
  tags:['batch','windows','errors'], desc:'Find out whether the last command actually worked.',
  steps:[
    {type:'read', title:'%errorlevel%', body:
"Every command sets an error level when it finishes. `0` means success. Anything else means something went wrong.\n\n~~~bat\ncopy missing.txt dest\\\necho Error level: %errorlevel%\n~~~\n\nIf `missing.txt` does not exist you get a nonzero error level. Common values: 1 means file not found, 2 means access denied.\n\nYou have to check it right after the command. Any other command resets it."},
    {type:'quiz', title:'Quick check', q:'What does error level 0 usually mean?',
     options:['catastrophic failure','success','warning','unknown'], answer:1,
     why:'Zero is success. Everything else is a kind of failure.'},
    {type:'read', title:'&& and ||', body:
"These chain on success or failure without you checking errorlevel manually.\n\n- `&&` runs the next command only if the previous one succeeded\n- `||` runs the next command only if the previous one failed\n\n~~~bat\ncopy a.txt b.txt && echo copied fine || echo copy failed\n~~~\n\nOne line. Prints \"copied fine\" on success, \"copy failed\" on failure. Really handy when your script needs to keep going either way."},
    {type:'quiz', title:'Quick check', q:'What does `||` do?',
     options:['means "or" in a boolean','runs the next command if the previous one failed','runs both commands','splits the script'], answer:1,
     why:'The double pipe is the "on failure" operator.'},
    {type:'predict', title:'What does this print?', lang:'bat',
     code:'@echo off\nif exist definitely_missing.xyz (echo found) else (echo missing)', answer:'missing',
     why:'The file does not exist, so the else branch runs.'}
  ]
},
{
  id:'bat-8', title:'Batch: Build a real backup tool', subject:'Batch', level:'Advanced', minutes:14,
  tags:['batch','windows','project'], desc:'Put everything together. A script you can actually use.',
  steps:[
    {type:'read', title:'What we are building', body:
"A `backup.bat` that:\n\n1. Makes a `backup` folder if it is missing\n2. Copies every `.txt` file from the current folder into it with a `.bak` extension\n3. Reports how many files it copied\n4. Waits for a key press at the end\n\nWe will build it in pieces."},
    {type:'read', title:'The pieces you already know', body:
"- `if not exist` to check the folder\n- `mkdir` to make it\n- `for %%f in (*.txt) do` to loop\n- `copy` with `/y`\n- `set /a` for the counter\n- `pause` at the end\n\nEverything below is just putting those in the right order."},
    {type:'read', title:'The script', body:
"~~~bat\n@echo off\nsetlocal\n\nset count=0\nif not exist backup mkdir backup\n\nfor %%f in (*.txt) do (\n    copy \"%%f\" \"backup\\%%~nf.bak\" /y >nul\n    set /a count+=1\n)\n\necho Backed up %count% file(s).\npause\n~~~\n\nA few details:\n\n- `setlocal` keeps the variables from leaking into the parent shell.\n- `>nul` throws away the copy command output so your own echo is clean.\n- `set /a count+=1` increments by one. That shorthand works with set /a."},
    {type:'quiz', title:'Quick check', q:'What does `>nul` do at the end of a command?',
     options:['redirects output to a file called nul','throws the output away','crashes','prints "nul"'], answer:1,
     why:'nul is the Windows black hole. Anything written there disappears.'},
    {type:'quiz', title:'Quick check', q:'What does `setlocal` do?',
     options:['starts a local network','keeps variables from leaking into the parent shell','locks the file','makes the script local only'], answer:1,
     why:'It makes a scope. When the script ends the variables go away.'},
    {type:'code', title:'Small piece', lang:'bat',
     prompt:'Make `backup` folder only if it does not exist, then print `ready`.',
     starter:'@echo off\n', expect:'ready',
     hint:'if not exist backup mkdir backup  then  echo ready'},
    {type:'read', title:'Done', body:
"That is a real script. Drop it in any folder full of `.txt` files, double click it, it backs them up.\n\nTo run it on a schedule, add it to Task Scheduler. To run it on a whole folder tree, swap `(*.txt)` for a recursive loop with `/r`.\n\nYou now know enough batch to automate something annoying in your own life. That was the whole point."}
  ]
},
{
  id:'bat-9', title:'Batch: Substrings and replace', subject:'Batch', level:'Advanced', minutes:10,
  tags:['batch','windows','strings'], desc:'Cut pieces out of a string, or swap one bit for another. The syntax is weird but it works.',
  steps:[
    {type:'read', title:'Cutting a string up', body:
"Batch slices strings with a modifier on the variable name.\n\n~~~bat\nset name=HelloWorld\necho %name:~0,5%     REM Hello  (first 5 characters)\necho %name:~5%       REM World  (from position 5 to the end)\necho %name:~0,-3%    REM HelloWo  (everything except last 3)\n~~~\n\nThe syntax is `%varname:~start,length%`. The length is optional. If you put a negative number for length, it counts from the end."},
    {type:'quiz', title:'Quick check', q:'If `name=HelloWorld`, what does `%name:~0,3%` give?',
     options:['Hello','Hel','World','H'], answer:1,
     why:'Start at 0, take 3 characters. That gives Hel.'},
    {type:'read', title:'Replacing text', body:
"~~~bat\nset msg=Hello World\necho %msg:World=There%\n~~~\n\nThat prints `Hello There`. The syntax is `%varname:find=replace%`.\n\nTo delete a substring entirely, leave the replace side empty:\n\n~~~bat\nset msg=Hello World\necho %msg: =%\n~~~\n\nThat gives `HelloWorld` — the space was removed."},
    {type:'quiz', title:'Quick check', q:'What does `%msg:a=A%` do?',
     options:['adds an A','replaces every "a" with "A"','checks if a is in msg','uppercases msg'], answer:1,
     why:'The find and replace syntax. Find on the left of the =, replace on the right.'},
    {type:'code', title:'Slice it', lang:'bat',
     prompt:'Set `word=HelloWorld`. Print the first 3 characters.',
     starter:'@echo off\n', expect:'Hel',
     hint:'set word=HelloWorld  then  echo %word:~0,3%'}
  ]
},
{
  id:'bat-10', title:'Batch: Delayed expansion (!var!)', subject:'Batch', level:'Advanced', minutes:11,
  tags:['batch','windows','gotcha'], desc:'The famous batch gotcha. If your counter always says 0 inside a loop, this is why.',
  steps:[
    {type:'read', title:'The problem', body:
"Inside a `for` loop or an `if` block, `%var%` gets expanded once when the whole block is parsed, not at each step.\n\n~~~bat\nset count=0\nfor /l %%i in (1,1,3) do (\n    set /a count+=1\n    echo %count%\n)\n~~~\n\nThat prints 0 three times. Not 1 2 3. The `%count%` was replaced with `0` before the loop even started, because at that moment count was 0.\n\nThis catches literally everyone."},
    {type:'quiz', title:'Quick check', q:'Why does `%count%` inside a for loop print the same value each time?',
     options:['batch is broken','%var% is expanded once when the block is parsed','count is not set','you need quotes'], answer:1,
     why:'Percent-variables expand at parse time. That is the whole problem.'},
    {type:'read', title:'The fix', body:
"Add `setlocal enabledelayedexpansion` at the top of the script. Then use `!var!` instead of `%var%` inside loops.\n\n~~~bat\n@echo off\nsetlocal enabledelayedexpansion\nset count=0\nfor /l %%i in (1,1,3) do (\n    set /a count+=1\n    echo !count!\n)\n~~~\n\nThat prints 1, 2, 3. The `!` syntax expands at runtime, so it picks up the current value."},
    {type:'quiz', title:'Quick check', q:'What must be at the top of the script for `!var!` to work?',
     options:['@echo off','setlocal enabledelayedexpansion','pause','cls'], answer:1,
     why:'Without it, ! is just a regular character and nothing expands.'},
    {type:'quiz', title:'Quick check', q:'What is the difference between `%count%` and `!count!`?',
     options:['no difference','% is parse time, ! is runtime','! is deprecated','! works everywhere'], answer:1,
     why:'% expands once at parse time. ! expands each time the line runs.'},
    {type:'read', title:'When to use which', body:
"Rule of thumb: use `%var%` at the top level of the script. Use `!var!` inside loops or parenthesised blocks.\n\nMixing them is fine — a script can use % in one place and ! in another. Just remember that % will not see changes made earlier in the same block."}
  ]
},
{
  id:'bat-11', title:'Batch: Redirects and pipes', subject:'Batch', level:'Advanced', minutes:10,
  tags:['batch','windows','redirects'], desc:'Send output to a file, throw it away, or hand it to another command.',
  steps:[
    {type:'read', title:'Redirects', body:
"By default commands print to the screen. Redirects send it somewhere else.\n\n~~~\ndir > files.txt       write output to a file (overwrites)\ndir >> files.txt      append instead of overwrite\ncopy a.txt b.txt 2> err.txt   send error output to a file\ndir >nul              throw output away entirely\n~~~\n\nQuick reference:\n\n- `>` output, overwrite\n- `>>` output, append\n- `2>` error output\n- `>nul` trash\n- `<` input from a file"},
    {type:'quiz', title:'Quick check', q:'What does `>>` do?',
     options:['overwrites a file','appends to a file','reads from a file','deletes a file'], answer:1,
     why:'Single > overwrites. Double >> adds to the end.'},
    {type:'quiz', title:'Quick check', q:'What does `2>` redirect?',
     options:['standard output','error output','input','both at once'], answer:1,
     why:'The 2 refers to stderr. Success output is 1.'},
    {type:'read', title:'Pipes', body:
"A pipe `|` sends the output of one command straight into another.\n\n~~~\ndir | find \"txt\"\ntype log.txt | more\n~~~\n\nThe first one lists the directory, then only shows the lines containing \"txt\". The second shows a file one screenful at a time.\n\nYou can also chain redirects:\n\n~~~\ncopy a.txt b.txt >nul 2>&1\n~~~\n\nThat copies quietly and throws away both normal and error output. `2>&1` means \"send error output to the same place as normal output\" — which is nul here."},
    {type:'quiz', title:'Quick check', q:'What does `|` do?',
     options:['means "or"','sends output of one command to the input of the next','splits lines','creates a file'], answer:1,
     why:'It is a pipe. Left command writes, right command reads.'},
    {type:'code', title:'Quiet copy', lang:'bat',
     prompt:'Copy `a.txt` to `b.txt` with `/y` and throw away the output. Then echo `done`.',
     starter:'@echo off\n', expect:'done',
     hint:'copy a.txt b.txt /y >nul  then  echo done'}
  ]
},
{
  id:'bat-12', title:'Batch: Environment variables', subject:'Batch', level:'Advanced', minutes:10,
  tags:['batch','windows','env'], desc:'Windows has a pile of variables already set. Learn what is in them.',
  steps:[
    {type:'read', title:'The free ones', body:
"Windows sets a bunch of environment variables you can just read.\n\n~~~\necho %USERNAME%      your login name\necho %USERPROFILE%   your user folder, like C:\\Users\\You\necho %CD%            the current directory\necho %PATH%          where Windows looks for programs\necho %DATE% %TIME%   current date and time\necho %COMPUTERNAME%  the machine name\necho %TEMP%          temp folder path\n~~~\n\nHandy for scripts that need to know where the user is or what day it is."},
    {type:'quiz', title:'Quick check', q:'Which one shows your current folder?',
     options:['%USERNAME%','%CD%','%PATH%','%DATE%'], answer:1,
     why:'CD = current directory. If you cd somewhere, %CD% updates.'},
    {type:'read', title:'set vs setx', body:

{
  id:'bat-13', title:'Batch: Build a file organiser', subject:'Batch', level:'Advanced', minutes:15,
  tags:['batch','windows','project'], desc:'The final project. Sort a messy folder into subfolders by file type.',
  steps:[
    {type:'read', title:'What we are building', body:
"A `tidy.bat` that sorts loose files in the current folder into subfolders.\n\n- `.jpg`, `.png`, `.gif` go into `images\\`\n- `.txt`, `.md`, `.pdf` go into `docs\\`\n- `.zip`, `.rar`, `.7z` go into `archives\\`\n- Anything else goes into `other\\`\n\nSame shape as the backup tool but with more branches."},
    {type:'read', title:'The skeleton', body:
"~~~bat\n@echo off\nsetlocal\n\nif not exist images mkdir images\nif not exist docs mkdir docs\nif not exist archives mkdir archives\nif not exist other mkdir other\n\necho Tidying up...\n~~~\n\nThe four `if not exist` lines make sure each folder is there before we start moving things. Safe to run twice."},
    {type:'read', title:'The move loops', body:
"~~~bat\nfor %%f in (*.jpg *.png *.gif) do move \"%%f\" images\\ >nul 2>nul\nfor %%f in (*.txt *.md *.pdf) do move \"%%f\" docs\\ >nul 2>nul\nfor %%f in (*.zip *.rar *.7z) do move \"%%f\" archives\\ >nul 2>nul\n~~~\n\nEach `for` loop matches a set of extensions. `move` sends them to the right folder. `>nul 2>nul` hides both the normal output and any errors (like \"file already there\").\n\nThe tricky part is `other\\` — you want files that are not in the previous groups. Batch makes this annoying. One approach:\n\n~~~bat\nfor %%f in (*.*) do (\n    if not \"%%~xf\"==\".jpg\" if not \"%%~xf\"==\".png\" if not \"%%~xf\"==\".gif\" if not \"%%~xf\"==\".txt\" if not \"%%~xf\"==\".md\" if not \"%%~xf\"==\".pdf\" if not \"%%~xf\"==\".zip\" if not \"%%~xf\"==\".rar\" if not \"%%~xf\"==\".7z\" move \"%%f\" other\\ >nul 2>nul\n)\n~~~\n\nUgly but it works. `%%~xf` is the extension including the dot."},
    {type:'quiz', title:'Quick check', q:'What does `%%~xf` give you for a file called `report.pdf`?',
     options:['report','pdf','.pdf','report.pdf'], answer:2,
     why:'The tilde-x modifier gives the extension including the dot.'},
    {type:'quiz', title:'Quick check', q:'Why put `2>nul` in addition to `>nul`?',
     options:['it is required','to hide error output as well','to speed it up','it does nothing'], answer:1,
     why:'>nul hides normal output. 2>nul hides errors. Together they keep the screen clean.'},
    {type:'read', title:'Putting it all together', body:
"~~~bat\n@echo off\nsetlocal\n\nif not exist images mkdir images\nif not exist docs mkdir docs\nif not exist archives mkdir archives\nif not exist other mkdir other\n\necho Tidying up...\n\nfor %%f in (*.jpg *.png *.gif) do move \"%%f\" images\\ >nul 2>nul\nfor %%f in (*.txt *.md *.pdf) do move \"%%f\" docs\\ >nul 2>nul\nfor %%f in (*.zip *.rar *.7z) do move \"%%f\" archives\\ >nul 2>nul\n\necho Done. Files sorted.\npause\n~~~\n\nDrop this in a messy folder, double click it, and the mess is gone. Test it in a scratch folder first — `move` is not polite about asking."},
    {type:'code', title:'Try a piece', lang:'bat',
     prompt:'Make sure `images` folder exists (safe to run twice), then echo `ok`.',
     starter:'@echo off\n', expect:'ok',

/* ============================================================
   ROUTER
   ============================================================ */
const app = $('#app');
let player = null;
let focusTimer = null;

function go(route){ location.hash = '#/' + route; }
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const [view, ...rest] = h.split('/');
  return { view: view || 'home', param: rest.join('/') };
}
window.addEventListener('hashchange', render);
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if(g && !g.classList.contains('locked')){ e.preventDefault(); go(g.dataset.go); }
});

function render(){
  stopFocus(false);
  commitTimer();
  player = null;
  const { view, param } = currentRoute();
  $$('.navlinks button').forEach(b => {
    const t = b.dataset.go;
    b.classList.toggle('on', t === view || (view === 'lesson' && t === 'lessons'));
  });
  window.scrollTo({top:0, behavior:'instant'});
  if(view === 'home') viewHome();
  else if(view === 'lessons') viewLessons();
  else if(view === 'lesson') viewLesson(param);
  else if(view === 'playground') viewPlayground();
  else if(view === 'progress') viewProgress();
  else if(view === 'teacher') viewTeacher();
  else if(view === 'about') viewAbout();
  else if(view === 'cheats') viewCheats();
  else viewHome();
}

/* time tracking */
let timerStart = null, timerLesson = null;
function startTimer(id){ stopTimerOnly(); timerStart = Date.now(); timerLesson = id; }
function stopTimerOnly(){
  if(timerStart && timerLesson){
    const secs = Math.floor((Date.now() - timerStart) / 1000);
    S.timeSpent[timerLesson] = (S.timeSpent[timerLesson] || 0) + secs;
    save();
    timerStart = null; timerLesson = null;
  }
}
function commitTimer(){ stopTimerOnly(); }

function card(l){
  const done = S.completed[l.id];
  const spent = S.timeSpent[l.id] || 0;
  return '<div class="lcard" data-go="lesson/' + l.id + '">' +
    (done ? '<div class="done-badge">✓</div>' : '') +
    '<div class="row" style="gap:.4rem">' +
      '<span class="tag">' + esc(l.subject) + '</span>' +
      '<span class="tag ' + (l.level === 'Beginner' ? 'g' : l.level === 'Intermediate' ? 'y' : 'r') + '">' + esc(l.level) + '</span>' +
    '</div>' +
    '<h3>' + esc(l.title) + '</h3>' +
    '<p>' + esc(l.desc) + '</p>' +
    '<div class="foot">' +
      '<span>' + l.steps.length + ' steps</span>' +
      '<span>·</span>' +
      '<span>' + l.minutes + ' min</span>' +
      (spent > 60 ? '<span>·</span><span>spent ' + fmtDur(spent) + '</span>' : '') +
    '</div>' +
  '</div>';
}
function fmtDur(s){
  if(s < 60) return s + 's';
  const m = Math.floor(s/60), h = Math.floor(m/60);
  if(h > 0) return h + 'h ' + (m%60) + 'm';
  return m + 'm';
}

function paintProgress(){
  const n = player.lesson.steps.length;
  const done = player.completed.size;
  $('#pfill').style.width = (done/n*100) + '%';
  $('#dots').innerHTML = player.lesson.steps.map((s, i) => {
    const cls = ['dot'];
    if(i === player.index) cls.push('on');
    if(player.completed.has(i)) cls.push('done');
    const unlocked = i <= player.index || player.completed.has(i-1);
    if(!unlocked) cls.push('locked');
    return '<button class="' + cls.join(' ') + '" data-jump="' + i + '" title="' + esc(s.title || s.type) + '">' +
      (player.completed.has(i) ? '✓' : i+1) + '</button>';
  }).join('') + '<span class="dim" style="margin-left:.5rem;font-size:.78rem">' + done + ' / ' + n + ' done</span>';
  $$('#dots [data-jump]').forEach(b => b.onclick = () => {
    const i = +b.dataset.jump;
    if(i <= player.index || player.completed.has(i-1)){ player.index = i; paintStep(); }

function paintStep(){
  const { lesson, index } = player;
  const step = lesson.steps[index];
  const host = $('#stepHost');
  const n = lesson.steps.length;
  const last = index === n - 1;
  const hard = S.hardMode;

  const head = '<div class="row" style="justify-content:space-between;margin-bottom:1rem">' +
      '<span class="tag v">Step ' + (index+1) + ' of ' + n + '</span>' +
      '<span class="dim" style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em">' + step.type + '</span>' +

    inner = head + '<h3>' + esc(step.title || 'Read') + '</h3><div class="body">' + md(step.body) + '</div>' +
      '<div class="stepfoot"><button class="btn pri" id="doneBtn">Got it →</button></div>';

    inner = head + '<h3>' + esc(step.title || 'Quick check') + '</h3><div class="body">' + md(step.q) + '</div>' +
      '<div id="opts" style="margin-top:1rem">' +

      '</div>' +
      '<div id="fb"></div>' +
      '<div class="stepfoot"><button class="btn pri" id="checkBtn" disabled>Check</button></div>';
  }
  else if(step.type === 'predict'){
    inner = head + '<h3>' + esc(step.title || 'What does this print?') + '</h3>' +

      '</div>' +
      '<div class="console" id="out">Press Run to see the output.</div>' +
      '<div id="fb"></div>';
  }
  else if(step.type === 'type'){
    inner = head + '<h3>' + esc(step.title || 'From memory') + '</h3><div class="body">' + md(step.prompt) + '</div>' +
      '<input class="answer" id="ans" placeholder="type your answer…" autocomplete="off" spellcheck="false" style="margin-top:.8rem">' +
      '<div id="fb"></div>' +
      '<div class="stepfoot"><button class="btn pri" id="checkBtn">Check</button>' +
        (hard ? '' : '<button class="btn ghost sm" id="hintBtn">💡 Hint</button>') +
      '</div>';
  }

  host.innerHTML = '<div class="step">' + inner + '</div>';

  const nav = document.createElement('div');
  nav.className = 'stepfoot';
  nav.innerHTML =
    '<button class="btn ghost" id="prevBtn" ' + (index === 0 ? 'disabled' : '') + '>← Back</button>' +
    '<span class="grow"></span>' +
    '<button class="btn ' + (player.completed.has(index) ? 'ok' : 'ghost') + '" id="nextBtn" ' + ((!player.completed.has(index) && !last) ? 'disabled' : '') + '>' +
      (last ? (player.completed.has(index) ? 'Finish lesson →' : 'Complete to finish') : 'Next →') +
    '</button>';
  host.appendChild(nav);

  $('#prevBtn').onclick = () => { if(player.index > 0){ player.index--; paintStep(); } };
  $('#nextBtn').onclick = () => {
    if(last){ finishLesson(); return; }
    player.index++; paintStep();
  };

  if(step.type === 'read'){
    $('#doneBtn').onclick = () => completeStep(8);

  if(step.type === 'quiz'){

    $$('#opts .opt').forEach(o => o.onclick = () => {
      if(player.completed.has(index)) return;
      $$('#opts .opt').forEach(x => x.classList.remove('sel'));

      sel = +o.dataset.i;
      $('#checkBtn').disabled = false;
    });

      S.quizTotal++;

        else if(i === sel) o.classList.add('wrong');

        feedback('ok', 'Yep.', step.why);

        feedback('bad', 'Not quite.', step.why);
      }
      $('#checkBtn').disabled = true;
    };

  if(step.type === 'predict' || step.type === 'type'){

      if(norm(input.value) === norm(step.answer)){
        input.style.borderColor = 'var(--ok)';
        feedback('ok', 'Correct.', step.why || '');
        completeStep(step.type === 'predict' ? 20 : 12);

        player.mistakes++;

    input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    const hb = $('#hintBtn'); if(hb) hb.onclick = () => hint(step.hint);
    input.focus();
  }

  if(step.type === 'code'){
    const ed = $('#editor'), out = $('#out');
    const hb = $('#hintBtn'); if(hb) hb.onclick = () => hint(step.hint);
    $('#resetBtn').onclick = () => { ed.value = step.starter || ''; out.innerHTML = 'Press Run to see the output.'; };
    const run = () => {
      const res = runCode(ed.value, step.lang);
      out.innerHTML = res.ok
        ? esc(res.output || '(no output)')
        : '<span class="err">' + esc(res.error) + '</span>';
      return res;
    };
    $('#runBtn').onclick = run;
    ed.addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); run(); }
    });
    $('#checkBtn').onclick = () => {
      const res = run();
      if(!res.ok){
        player.mistakes++;
        feedback('bad', 'Your code errored.', res.error);
        return;
      }
      const norm = s => String(s).replace(/\r/g, '').replace(/\s+$/, '').trim();
      if(norm(res.output) === norm(step.expect)){
        feedback('ok', 'That is the output.', 'Nice.');
        S.codeDone++;
        completeStep(25);
      } else {
        player.mistakes++;
        feedback('bad', 'Output is different.',
          'Expected:\n' + step.expect + '\n\nGot:\n' + (res.output || '(nothing)'));
      }
    };
  }

  paintProgress();
}

        paintStep();

function startFocus(minutes){

  const tick = () => {

    t.textContent = fmt(left);

      S.focusMinutes++; addXp(5, null); checkBadges(); save();

const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

/* ============================================================
   interpreters
   ============================================================ */
function splitArgs(str){
  const out = []; let cur = ''; let depth = 0; let q = null;
  for(let i = 0; i < str.length; i++){
    const c = str[i];
    if(q){ cur += c; if(c === q && str[i-1] !== '\\') q = null; continue; }
    if(c === '"' || c === "'"){ q = c; cur += c; continue; }
    if('([{'.includes(c)) depth++;
    if(')]}'.includes(c)) depth--;
    if(c === ',' && depth === 0){ out.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}

function evalPy(expr, vars){
  let e = String(expr).trim();
  e = e.replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false').replace(/\bNone\b/g, 'null');
  e = e.replace(/\band\b/g, '&&').replace(/\bor\b/g, '||').replace(/\bnot\s+/g, '!');
  // f-string
  if(/^f["']/.test(e)){
    const q = e[1];
    if(e.endsWith(q)){
      const inner = e.slice(2, -1);
      e = '`' + inner.replace(/\\?\{([^}]+)\}/g, (_, x) => '${' + x + '}') + '`';
    }
  }
  // method chains: .upper() .lower() .strip() .split() .replace() .append() → JS equivalents
  e = e.replace(/\.upper\(\)/g, '.toUpperCase()');
  e = e.replace(/\.lower\(\)/g, '.toLowerCase()');
  e = e.replace(/\.strip\(\)/g, '.trim()');
  e = e.replace(/\.split\(\)/g, '.split(/\\s+/)');
  const keys = Object.keys(vars);
  try{
    const fn = new Function(...keys, '"use strict"; return (' + e + ');');
    return fn(...keys.map(k => vars[k]));
  }catch(err){
    return expr;
  }
}

function runPython(src){
  const out = [];
  const vars = {};
  const rawLines = src.split('\n');
  const lines = [];
  for(let raw of rawLines){
    const clean = raw.replace(/#.*$/, '').replace(/\s+$/, '');
    if(!clean.trim()) continue;
    const indent = raw.match(/^\s*/)[0].replace(/\t/g, '    ').length;
    lines.push({ text: clean.trim(), indent });
  }

  let ip = 0;
  let steps = 0;
  const MAX = 5000;

  function tryMethodCall(text){
    // list.append(x)
    const ap = text.match(/^([A-Za-z_]\w*)\.append\((.+)\)$/);
    if(ap){
      const arr = vars[ap[1]];
      if(Array.isArray(arr)) arr.push(evalPy(ap[2], vars));
      return true;
    }
    // d[key] = value
    const dset = text.match(/^([A-Za-z_]\w*)\[["']?([^"'\]]+)["']?\]\s*=\s*(.+)$/);
    if(dset){
      const name = dset[1];
      if(!vars[name]) vars[name] = {};
      const key = dset[2].replace(/^["']|["']$/g, '');
      vars[name][key] = evalPy(dset[3], vars);
      return true;
    }
    return false;
  }

  function runOne(){
    const line = lines[ip];
    if(!line) return;
    const ifm = line.text.match(/^if\s+(.+):$/);
    if(ifm){
      const cond = !!evalPy(ifm[1], vars);
      const baseIndent = line.indent;
      ip++;
      let bodyEnd = ip;
      while(bodyEnd < lines.length && lines[bodyEnd].indent > baseIndent) bodyEnd++;
      if(!cond) ip = bodyEnd;
      return;
    }
    const form = line.text.match(/^for\s+(\w+)\s+in\s+range\(([^)]*)\)\s*:$/);
    if(form){
      const args = splitArgs(form[2]).map(a => +evalPy(a, vars) || 0);
      let start = 0, stop = args[0], step = 1;
      if(args.length === 2){ start = args[0]; stop = args[1]; }
      else if(args.length >= 3){ start = args[0]; stop = args[1]; step = args[2] || 1; }
      const baseIndent = line.indent;
      const bodyStart = ip + 1;
      let bodyEnd = bodyStart;
      while(bodyEnd < lines.length && lines[bodyEnd].indent > baseIndent) bodyEnd++;
      for(let v = start; (step > 0 ? v < stop : v > stop); v += step){
        vars[form[1]] = v;
        let j = bodyStart;
        while(j < bodyEnd){
          const ln = lines[j];
          const pr = ln.text.match(/^print\s*\((.*)\)\s*$/);
          if(pr) out.push(splitArgs(pr[1]).map(a => String(evalPy(a, vars))).join(' '));
          const asg = ln.text.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
          if(asg && !pr) vars[asg[1]] = evalPy(asg[2], vars);
          tryMethodCall(ln.text);
          j++;
        }
      }
      ip = bodyEnd;
      return;
    }
    const forl = line.text.match(/^for\s+(\w+)\s+in\s+(\[.+\])\s*:$/);
    if(forl){
      const list = evalPy(forl[2], vars);
      const baseIndent = line.indent;
      const bodyStart = ip + 1;
      let bodyEnd = bodyStart;
      while(bodyEnd < lines.length && lines[bodyEnd].indent > baseIndent) bodyEnd++;
      for(const item of list){
        vars[forl[1]] = item;
        let j = bodyStart;
        while(j < bodyEnd){
          const ln = lines[j];
          const pr = ln.text.match(/^print\s*\((.*)\)\s*$/);
          if(pr) out.push(splitArgs(pr[1]).map(a => String(evalPy(a, vars))).join(' '));
          const asg = ln.text.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
          if(asg && !pr) vars[asg[1]] = evalPy(asg[2], vars);
          j++;
        }
      }
      ip = bodyEnd;
      return;
    }
    const pr = line.text.match(/^print\s*\((.*)\)\s*$/);
    if(pr){
      out.push(splitArgs(pr[1]).map(a => String(evalPy(a, vars))).join(' '));
      ip++;
      return;
    }
    const asg = line.text.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if(asg){ vars[asg[1]] = evalPy(asg[2], vars); ip++; return; }
    if(tryMethodCall(line.text)){ ip++; return; }
    ip++;
  }

  function runBlock(minIndent){
    while(ip < lines.length){
      if(++steps > MAX) return;
      const line = lines[ip];
      if(line.indent < minIndent) return;
      if(line.indent > minIndent){ ip++; continue; }

      const ifm = line.text.match(/^if\s+(.+):$/);
      if(ifm){
        const baseIndent = line.indent;
        const condVal = !!evalPy(ifm[1], vars);
        ip++;
        let thenEnd = ip;
        while(thenEnd < lines.length && lines[thenEnd].indent > baseIndent) thenEnd++;
        if(condVal){ runBlock(baseIndent + 1); }
        else { ip = thenEnd; }
        while(ip < lines.length && lines[ip].indent === baseIndent){
          const t = lines[ip].text;
          const elifm = t.match(/^elif\s+(.+):$/);
          const elsem = t.match(/^else\s*:$/);
          if(elifm){
            ip++;
            let end = ip;
            while(end < lines.length && lines[end].indent > baseIndent) end++;
            if(!condVal && !thenEnd.taken){}
            // simplified: we do not track elif properly for the mini-runner, just run if else
            ip = end;
            break;
          } else if(elsem){
            ip++;
            let end = ip;
            while(end < lines.length && lines[end].indent > baseIndent) end++;
            if(!condVal){ runBlock(baseIndent + 1); }
            ip = end;
            break;
          } else break;
        }
        continue;
      }

      const form = line.text.match(/^for\s+(\w+)\s+in\s+range\(([^)]*)\)\s*:$/);
      if(form){
        const args = splitArgs(form[2]).map(a => +evalPy(a, vars) || 0);
        let start = 0, stop = 0, step = 1;
        if(args.length === 1){ stop = args[0]; }
        else if(args.length === 2){ start = args[0]; stop = args[1]; }
        else if(args.length >= 3){ start = args[0]; stop = args[1]; step = args[2] || 1; }
        if(step === 0) step = 1;
        const baseIndent = line.indent;
        const bodyStart = ip + 1;
        let bodyEnd = bodyStart;
        while(bodyEnd < lines.length && lines[bodyEnd].indent > baseIndent) bodyEnd++;
        for(let v = start; (step > 0 ? v < stop : v > stop); v += step){
          vars[form[1]] = v;
          ip = bodyStart;
          while(ip < bodyEnd){
            const before = ip;
            runOne();
            if(ip === before) ip++;
            if(steps++ > MAX) break;
          }
        }
        ip = bodyEnd;
        continue;
      }

      const forl = line.text.match(/^for\s+(\w+)\s+in\s+(\[.+\])\s*:$/);
      if(forl){
        const list = evalPy(forl[2], vars);
        const baseIndent = line.indent;
        const bodyStart = ip + 1;
        let bodyEnd = bodyStart;
        while(bodyEnd < lines.length && lines[bodyEnd].indent > baseIndent) bodyEnd++;
        for(const item of list){
          vars[forl[1]] = item;
          ip = bodyStart;
          while(ip < bodyEnd){
            const before = ip;
            runOne();
            if(ip === before) ip++;
            if(steps++ > MAX) break;
          }
        }
        ip = bodyEnd;
        continue;
      }

      const whilem = line.text.match(/^while\s+(.+):$/);
      if(whilem){
        const baseIndent = line.indent;
        const bodyStart = ip + 1;
        let bodyEnd = bodyStart;
        while(bodyEnd < lines.length && lines[bodyEnd].indent > baseIndent) bodyEnd++;
        let guard = 0;
        while(!!evalPy(whilem[1], vars) && guard++ < 2000){
          ip = bodyStart;
          while(ip < bodyEnd){
            const before = ip;
            runOne();
            if(ip === before) ip++;
            if(steps++ > MAX) break;
          }
        }
        ip = bodyEnd;
        continue;
      }

      const defm = line.text.match(/^def\s+(\w+)\s*\(([^)]*)\)\s*:$/);
      if(defm){
        const fname = defm[1];
        const params = defm[2].split(',').map(s => s.trim()).filter(Boolean);
        const baseIndent = line.indent;
        const bodyStart = ip + 1;
        let bodyEnd = bodyStart;
        while(bodyEnd < lines.length && lines[bodyEnd].indent > baseIndent) bodyEnd++;
        const body = lines.slice(bodyStart, bodyEnd);
        vars[fname] = (...args) => {
          const scopeVars = Object.assign({}, vars);
          params.forEach((p, i) => { scopeVars[p] = args[i]; });
          for(const ln of body){
            const t = ln.text;
            const pr = t.match(/^print\s*\((.*)\)\s*$/);
            if(pr){ out.push(splitArgs(pr[1]).map(a => String(evalPy(a, scopeVars))).join(' ')); continue; }
            const rm = t.match(/^return\s+(.+)$/);
            if(rm){ return evalPy(rm[1], scopeVars); }
            const asg = t.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
            if(asg){ scopeVars[asg[1]] = evalPy(asg[2], scopeVars); continue; }
          }
          return undefined;
        };
        ip = bodyEnd;
        continue;
      }

      const ret = line.text.match(/^return\s+(.+)$/);
      if(ret){ ip++; continue; }

      const pr = line.text.match(/^print\s*\((.*)\)\s*$/);
      if(pr){
        out.push(splitArgs(pr[1]).map(a => String(evalPy(a, vars))).join(' '));
        ip++;
        continue;
      }

      const asg = line.text.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
      if(asg){
        vars[asg[1]] = evalPy(asg[2], vars);
        ip++;
        continue;
      }

      if(tryMethodCall(line.text)){ ip++; continue; }

      ip++;
    }
  }

  try{
    runBlock(0);
    return { ok:true, output: out.join('\n') };
  } catch(e){
    return { ok:false, output: out.join('\n'), error: 'Runtime error: ' + (e.message || e) };
  }
}

function runJS(src){
  const out = [];
  const fake = {
    log: (...a) => out.push(a.map(x => (typeof x === 'object' && x !== null) ? JSON.stringify(x) : String(x)).join(' ')),
    error: (...a) => out.push(a.map(String).join(' ')),
    warn: (...a) => out.push(a.map(String).join(' '))
  };
  try{
    const fn = new Function('console', '"use strict";\n' + src);
    const r = fn(fake);
    if(r !== undefined && out.length === 0) out.push(String(r));
    return { ok:true, output: out.join('\n') };
  } catch(e){
    return { ok:false, output: out.join('\n'), error: e.name + ': ' + e.message };
  }
}

function runBat(src){
  const vars = {};
  const out = [];
  const lines = src.split('\n');
  const labels = {};
  lines.forEach((line, i) => {
    const m = line.trim().match(/^:([A-Za-z_]\w*)/);
    if(m) labels[m[1].toLowerCase()] = i;
  });

  function expand(str){
    return str
      .replace(/%([A-Za-z_]\w*)%/g, (_, k) => vars[k.toLowerCase()] != null ? vars[k.toLowerCase()] : '')
      .replace(/%%/g, '%');
  }
  // substring / replace modifiers
  function expandMods(str){
    // %var:~start,length%  or  %var:~start%
    let out = str.replace(/%([A-Za-z_]\w*):~(-?\d+)(?:,(-?\d+))?%/g, (_, name, start, len) => {
      const v = vars[name.toLowerCase()] || '';
      const s = parseInt(start, 10);
      const st = s < 0 ? v.length + s : s;
      if(len == null) return v.slice(st);
      const l = parseInt(len, 10);
      return l < 0 ? v.slice(st, v.length + l) : v.slice(st, st + l);
    });
    // %var:find=replace%
    out = out.replace(/%([A-Za-z_]\w*):([^=]*)=([^%]*)%/g, (_, name, find, repl) => {
      const v = vars[name.toLowerCase()] || '';
      return v.split(find).join(repl);
    });
    return out;
  }
  function fullExpand(str){ return expandMods(expand(str)); }

  let ip = 0, steps = 0;
  const MAX = 3000;

  while(ip < lines.length && steps++ < MAX){
    let line = lines[ip].trim();
    if(!line){ ip++; continue; }
    if(line.startsWith('::') || /^rem\b/i.test(line)){ ip++; continue; }
    if(/^@?echo\s+off\s*$/i.test(line)){ ip++; continue; }
    if(/^pause\s*$/i.test(line)){ ip++; continue; }
    if(/^(cls|title|color|setlocal|endlocal)\b/i.test(line)){ ip++; continue; }
    if(/^:([A-Za-z_]\w*)/.test(line)){ ip++; continue; }
    if(/^exit\s*\/b\b/i.test(line)){ break; }

    const gtm = line.match(/^goto\s+:?([A-Za-z_]\w*)/i);
    if(gtm){
      const target = gtm[1].toLowerCase();
      if(labels[target] != null){ ip = labels[target]; continue; }
      else { out.push('⚠ goto :' + gtm[1] + ' — no such label'); ip++; continue; }
    }

    // set /a with +=
    const incm = line.match(/^set\s+\/a\s+([A-Za-z_]\w*)\s*\+=\s*(.+)$/i);
    if(incm){
      const name = incm[1].toLowerCase();
      const cur = parseInt(vars[name] || '0', 10) || 0;
      const delta = parseInt(fullExpand(incm[2]), 10) || 0;
      vars[name] = String(cur + delta);
      ip++; continue;
    }
    // set /a
    const setam = line.match(/^set\s+\/a\s+([A-Za-z_]\w*)\s*=\s*(.+)$/i);
    if(setam){
      const name = setam[1].toLowerCase();
      const expr = fullExpand(setam[2]);
      try{
        const val = Function('"use strict"; return (' + expr + ');')();
        vars[name] = String(val);
      }catch(e){ vars[name] = '0'; }
      ip++; continue;
    }
    if(/^set\s+\/p\b/i.test(line)){ ip++; continue; }
    const setm = line.match(/^set\s+"?([A-Za-z_]\w*)=([^"]*)"?\s*$/i);
    if(setm){
      vars[setm[1].toLowerCase()] = setm[2];
      ip++; continue;
    }

    // if
    const ifm = line.match(/^if\s+(not\s+)?(exist\s+\S+|"[^"]*"\s*==\s*"[^"]*"|\S+\s+(?:equ|neq|lss|leq|gtr|geq)\s+\S+)\s+(.+)$/i);
    if(ifm){
      const notFlag = !!ifm[1];
      const cond = ifm[2].trim();
      const rest = ifm[3].trim();
      let result = false;
      const existM = cond.match(/^exist\s+(\S+)/i);
      if(existM){
        const target = existM[1].toLowerCase();
        result = !/missing|nothing|nonexistent|nope/.test(target);
      } else {
        const eqm = cond.match(/^"?([^"=]+)"?\s*==\s*"?([^"]*)"?$/);
        const numm = cond.match(/^(\S+)\s+(equ|neq|lss|leq|gtr|geq)\s+(\S+)$/i);
        if(eqm){
          const L = fullExpand(eqm[1].trim()).replace(/^"|"$/g, '');
          const R = eqm[2].replace(/^"|"$/g, '').trim();
          result = L === R;
        } else if(numm){
          const L = parseFloat(fullExpand(numm[1])) || 0;
          const R = parseFloat(numm[3]) || 0;
          const op = numm[2].toLowerCase();
          if(op === 'equ') result = L === R;
          else if(op === 'neq') result = L !== R;
          else if(op === 'lss') result = L < R;
          else if(op === 'leq') result = L <= R;
          else if(op === 'gtr') result = L > R;
          else if(op === 'geq') result = L >= R;
        }
      }
      if(notFlag) result = !result;
      if(result){
        const em = rest.match(/^@?echo\s+(.+)$/i);
        if(em) out.push(fullExpand(em[1]));
        const gm = rest.match(/^goto\s+:?([A-Za-z_]\w*)/i);
        if(gm){
          const t = gm[1].toLowerCase();
          if(labels[t] != null){ ip = labels[t]; continue; }
        }
      }
      ip++; continue;
    }

    // echo
    const em = line.match(/^@?echo\s*(.*)$/i);
    if(em){
      let txt = em[1];
      if(txt.trim() === ''){ out.push(''); ip++; continue; }
      if(txt.trim().toLowerCase() === 'off'){ ip++; continue; }
      out.push(fullExpand(txt));
      ip++; continue;
    }

    ip++;
  }
  if(steps >= MAX) out.push('⚠ Stopped after ' + MAX + ' steps.');
  return { ok:true, output: out.join('\n') };
}

function runCode(src, lang){
  try{
    if(lang === 'python') return runPython(src);
    if(lang === 'bat')    return runBat(src);
    if(lang === 'js')     return runJS(src);
    return { ok:false, output:'', error:'Unknown language: ' + lang };
  } catch(e){
    return { ok:false, output:'', error: String(e.message || e) };
  }
}

function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
